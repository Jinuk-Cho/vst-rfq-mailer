<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VST 견적요청 메일 작성기</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b2330; --muted:#5d6878; --line:#d9dee6;
  --accent:#1f4e9c; --accent-ink:#ffffff; --soft:#eaf0fa;
  --bad:#b3261e; --bad-bg:#fdecea; --warn:#8a5a00; --warn-bg:#fff4d6; --ok:#1b6b3a; --ok-bg:#e5f5ea;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161c; --panel:#1b212a; --ink:#e8ecf2; --muted:#9aa6b6; --line:#323b48;
    --accent:#7aa7f0; --accent-ink:#0d1522; --soft:#232d3c;
    --bad:#ff8a80; --bad-bg:#3a1f1d; --warn:#ffcf70; --warn-bg:#3a2f14; --ok:#7fd69b; --ok-bg:#17301f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1 1 auto;min-width:200px}
.tabs,.langs{display:flex;gap:4px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.chip{padding:3px 8px;font-size:12px;white-space:nowrap;color:var(--warn);background:var(--warn-bg);border-color:transparent}
button.x{padding:2px 9px;color:var(--bad)}
main{padding:16px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 4px}
.card p.d{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 12px}
.fld{min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.req{color:var(--bad)}
.inrow{display:flex;gap:6px;align-items:center}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--soft)}
.item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 12px}
.checks label{display:flex;gap:6px;align-items:flex-start}
.side{position:sticky;top:64px}
@media (max-width:980px){.side{position:static}}
.box{border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.box b{display:block;margin-bottom:2px}
.box.bad{background:var(--bad-bg);color:var(--bad)}
.box.warn{background:var(--warn-bg);color:var(--warn)}
.box.ok{background:var(--ok-bg);color:var(--ok)}
.box ul{margin:0;padding-left:18px}
textarea{resize:vertical;font-family:inherit;line-height:1.6}
#mailBody{height:420px}
#intBody{height:200px;font-size:12.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.note{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
#toast{max-width:90vw;text-align:center;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
[hidden]{display:none!important}
@media (max-width:980px){input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <span id="who" class="note" style="font-weight:600"></span>
  <div class="tabs">
    <button data-tab="write" data-t="tab_write"></button>
    <button data-tab="hist" data-t="tab_hist"></button>
    <button data-tab="set" data-t="tab_set"></button>
  </div>
  <div class="langs">
    <button data-lang="ko">한국어</button>
    <button data-lang="vi">Tiếng Việt</button>
  </div>
</header>
<main>
  <section id="tab-write" class="grid">
    <div id="form"></div>
    <div class="side">
      <div class="card">
        <div id="valid"></div>
        <h2 data-t="out_mail"></h2>
        <div class="fld" style="margin:8px 0"><label data-t="out_subj"></label><input type="text" id="mailSubj"></div>
        <textarea id="mailBody" spellcheck="false"></textarea>
        <div class="note" data-t="out_note"></div>
        <div class="btns">
          <button class="primary" id="bCopy" data-t="b_copy"></button>
          <button id="bGmail" data-t="b_gmail"></button>
          <button id="bSave" data-t="b_save"></button>
          <button id="bNew" data-t="b_new"></button>
        </div>
        <div class="note" id="blockNote" data-t="v_block"></div>
      </div>
      <div class="card">
        <h2 data-t="out_int"></h2>
        <p class="d" data-t="out_int_d"></p>
        <textarea id="intBody" readonly spellcheck="false"></textarea>
        <div class="btns"><button id="bCopyInt" data-t="b_copyint"></button></div>
      </div>
      <div class="card">
        <h2 data-t="fu_title"></h2>
        <p class="d" data-t="fu_d"></p>
        <div class="fld"><label data-t="fu_call"></label><textarea id="callBody" readonly spellcheck="false" style="height:210px"></textarea></div>
        <div class="btns"><button id="bCopyCall" data-t="b_copycall"></button></div>
        <div class="fld"><label data-t="fu_nudge"></label><textarea id="nudgeBody" readonly spellcheck="false" style="height:190px"></textarea></div>
        <div class="btns"><button id="bCopyNudge" data-t="b_copynudge"></button></div>
      </div>
    </div>
  </section>
  <section id="tab-hist" hidden>
    <div class="card">
      <div class="btns" style="margin-top:0"><button id="bCsv" data-t="b_csv"></button> <button id="bShared" data-t="b_shared"></button></div>
      <div class="tablewrap" id="shared"></div>
      <p class="d" data-t="hist_note"></p>
      <div class="tablewrap" id="hist"></div>
    </div>
  </section>
  <section id="tab-set" hidden>
    <div class="card">
      <h2 data-t="tab_set"></h2>
      <p class="d" data-t="set_d"></p>
      <div class="fields" id="setForm"></div>
    </div>
    <div class="card">
      <h2 data-t="sup_title"></h2>
      <p class="d" data-t="sup_d"></p>
      <div id="supList"></div>
    </div>
    <div class="card">
      <h2 data-t="sync_title"></h2>
      <p class="d" data-t="sync_d"></p>
      <div class="fields" id="syncForm"></div>
      <div class="btns"><button id="bSyncTest" data-t="b_synctest"></button></div>
    </div>
  </section>
</main>
<datalist id="sites">
  <option value="SEV (박닌)"><option value="SEVT (타이응우옌)"><option value="SDV (삼성디스플레이, 박닌)">
  <option value="SEMV (삼성전기, 타이응우옌)"><option value="SEHC (호치민)">
</datalist>
<datalist id="units"><option value="EA"><option value="SET"><option value="PAC"><option value="대"><option value="BOX"><option value="M"></datalist>
<datalist id="attrkeys"><option value="재질"><option value="표면처리"><option value="포장 단위"><option value="압력 등급"><option value="전압·상·주파수"><option value="연결 방식"><option value="색상"><option value="비고"></datalist>
<div id="toast" role="status" aria-live="polite"></div>

const SET_DEFAULT = {company:'Vina Solutions., JSC (VST)', sender:'', role:'영업 및 프로젝트 개발', tel:'', email:'',

const SUP_SEED = [];

function addBizDays(n){ const d=new Date(); while(n>0){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) n--; }
  return ymd(d); }
// 품목 = 제품 1개. attrs: 사양 항목(재질, 표면처리, 포장 단위...), rows: 규격별 수량.
const newRow = () => ({spec:'',qty:''});
const newItem = () => ({name:'',model:'',attrs:[],rows:[newRow()],unit:'EA',code:'',moq:'',cat:'',catLink:''});
function normItem(x){
  const it=Object.assign(newItem(),x);
  if(!Array.isArray(x.rows)||!x.rows.length) it.rows=[{spec:String(x.spec||''),qty:String(x.qty||'')}]; // 구버전 품목 변환
  it.rows=it.rows.filter(r=>r&&typeof r==='object').map(r=>Object.assign(newRow(),r));
  if(!it.rows.length) it.rows=[newRow()];
  it.attrs=(Array.isArray(it.attrs)?it.attrs:[]).filter(a=>a&&typeof a==='object').map(a=>Object.assign({k:'',v:''},a));
  delete it.spec; delete it.qty;
  return it;
}
const qtyNum = q => { const n=Number(String(q??'').replace(/,/g,'')); return isFinite(n)?n:NaN; };
const itemTotal = it => it.rows.reduce((a,r)=>{ const n=qtyNum(r.qty); return a+(n>0?n:0); },0);
function itemSpecText(it){
  const a=it.attrs.filter(x=>has(x.k)&&has(x.v)).map(x=>`${x.k}: ${x.v}`);
  const rows=it.rows.filter(r=>has(r.spec));
  if(rows.length) a.push((it.rows.length>1?'규격별 ':'규격 ')+rows.map(r=>has(r.qty)&&it.rows.length>1?`${r.spec} ${r.qty}`:r.spec).join(', '));
  return a.join(' / ');
}
const blank = () => ({staff:'',site:'',dept:'',sPic:'',purpose:'',needBy:'',repeat:'',memo:'',
  supName:'',supPic:'',supEmail:'', items:[newItem()],
  asks:{quote:true,moq:true,lead:true,pay:true,inco:false,doc:false,war:false,hs:true,co:true,cq:true,spare:false},
  intro:'A', prot:'ask', oSamsung:false, oDept:false, oCode:false,
  att:{spec:false,photo:false,catalog:false}, replyBy:addBizDays(3)});
// 저장된 구버전·손상 데이터를 안전하게 정리한다.
function normalize(o){
  const r=Object.assign(blank(), (o&&typeof o==='object'&&!Array.isArray(o))?o:{});
  r.items=(Array.isArray(r.items)?r.items:[]).filter(x=>x&&typeof x==='object').map(normItem);
  if(!r.items.length) r.items=[newItem()];
  r.asks=Object.assign(blank().asks,(r.asks&&typeof r.asks==='object')?r.asks:{});
  r.att=Object.assign(blank().att,(r.att&&typeof r.att==='object')?r.att:{});
  if(!['new','maint','cons','sample'].includes(r.purpose)) r.purpose='';
  if(!['A','B','C'].includes(r.intro)) r.intro='A';
  if(!['none','ask','strong'].includes(r.prot)) r.prot='ask';
  return r;
}

function ymd(d){ const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const dateOf = ts => { const d=ts?new Date(ts):null; return d&&!isNaN(d)?ymd(d):''; };
const sentDate = s => dateOf(s.ts)||ymd(new Date());

function el(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==='class') e.className=attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat(Infinity).forEach(c=>{ if(c!=null && c!=='') e.append(c); });
  return e;
}
let uid=0;
function field(obj, key, labelKey, o={}){
  const id='f'+(++uid);
  let inp;
  if(o.opts){
    inp=el('select',{id});
    if(!o.noEmpty) inp.append(el('option',{value:''},'—'));
    o.opts.forEach(v=>inp.append(el('option',{value:v},t(o.op+v))));
  }else{
    inp=el('input',{id,type:o.type||'text'});
    if(o.list) inp.setAttribute('list',o.list);
    if(o.ph) inp.placeholder=t(o.ph);
  }
  inp.value = obj[key] ?? '';
  inp.addEventListener('input',()=>{ obj[key]=inp.value; (o.after||refresh)(); });
  const row=el('div',{class:'inrow'},inp);
  if(o.unk) row.append(el('button',{type:'button',class:'chip','aria-label':t('unk')+': '+t(labelKey),onclick:()=>{ inp.value=obj[key]=UNK; refresh(); }},t('unk')));
  return el('div',{class:'fld'+(o.wide?' wide':'')},
    el('label',{for:id}, t(labelKey), o.req?el('span',{class:'req'},' *'):''), row);
}
function check(obj,key,labelKey){
  const c=el('input',{type:'checkbox'}); c.checked=!!obj[key];
  c.addEventListener('change',()=>{ obj[key]=c.checked; refresh(); });
  return el('label',null,c,el('span',null,t(labelKey)));
}
function card(titleKey, descKey, ...kids){
  return el('div',{class:'card'}, el('h2',null,t(titleKey)), descKey?el('p',{class:'d'},t(descKey)):'', kids);
}

let FILES=[]; // 첨부 파일은 메모리에만 둔다(브라우저 저장소 용량 때문). 새로고침하면 다시 골라야 한다.
function renderFiles(){
  const w=$('#fileList'); if(!w) return; w.textContent='';
  FILES.forEach((f,i)=>{
    const row=el('div',{class:'inrow',style:'margin:4px 0'});
    if(f.type.startsWith('image/')) row.append(el('img',{src:URL.createObjectURL(f),alt:'',style:'width:48px;height:48px;object-fit:cover;border-radius:4px'}));
    row.append(el('span',{style:'flex:1;word-break:break-all'},`${f.name} (${Math.ceil(f.size/1024)} KB)`),
      el('button',{type:'button',class:'x',onclick:()=>{ FILES.splice(i,1); renderFiles(); refresh(); }},'×'));
    w.append(row);
  });
}

function textIn(obj,key,ph,extra){
  const i=el('input',Object.assign({type:'text',placeholder:ph,'aria-label':ph},extra||{}));
  i.value=obj[key]??''; i.addEventListener('input',()=>{ obj[key]=i.value; refresh(); }); return i;
}
function delBtn(fn){ return el('button',{type:'button',class:'x','aria-label':t('b_del'),onclick:fn},'×'); }
function specBlock(it){
  const box=el('div',{class:'fld wide'},el('label',null,t('i_attrs')));
  it.attrs.forEach((a,j)=>box.append(el('div',{class:'inrow',style:'margin:4px 0'},
    textIn(a,'k',t('i_attr_k'),{list:'attrkeys'}), textIn(a,'v',t('i_attr_v')),
    delBtn(()=>{ it.attrs.splice(j,1); renderForm(); refresh(); }))));
  box.append(el('div',{class:'btns',style:'margin:4px 0'},ATTR_KEYS.map(k=>
    el('button',{type:'button',class:'chip',onclick:()=>{ it.attrs.push({k:k==='기타'?'':k,v:''}); renderForm(); refresh(); }},'+ '+k))));
  return box;
}
function rowsBlock(it){
  const box=el('div',{class:'fld wide'},el('label',null,t('i_rows'),el('span',{class:'req'},' *')));
  it.rows.forEach((r,j)=>box.append(el('div',{class:'inrow',style:'margin:4px 0'},
    textIn(r,'spec',t('i_row_spec')), textIn(r,'qty',t('i_qty'),{inputmode:'numeric',style:'max-width:130px'}),
    it.rows.length>1?delBtn(()=>{ it.rows.splice(j,1); renderForm(); refresh(); }):'')));
  box.append(el('button',{type:'button',onclick:()=>{ it.rows.push(newRow()); renderForm(); refresh(); }},t('add_row')));
  return box;
}

const has = v => String(v??'').trim()!=='';
const known = v => has(v) && String(v).trim()!==UNK;
function validate(s=S){
  const miss=[], unk=[];
  const chk=(v,label)=>{ if(!has(v)) miss.push(label); else if(!known(v)) unk.push(label); };
  // 메일 본문에 그대로 들어가는 값은 "미확인"도 허용하지 않는다.
  const hard=(v,label)=>{ if(!known(v)) miss.push(label); };
  chk(s.staff,t('f_staff')); chk(s.site,t('f_site')); chk(s.dept,t('f_dept'));
  chk(s.purpose,t('f_purpose')); chk(s.needBy,t('f_needBy')); hard(s.supName,t('f_supName'));
  const ct=[s.supEmail,s.supTel];
  if(known(s.supEmail) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(s.supEmail).trim())) miss.push(t('v_email'));
  if(s===S && has(s.replyBy) && s.replyBy<ymd(new Date())) unk.push(t('v_past'));
  if(s===S && known(s.staff) && has(SET.sender) && s.staff.trim()!==SET.sender.trim()) unk.push(t('v_author'));
  if(!ct.some(has)) miss.push(t('v_contact')); else if(!ct.some(known)) unk.push(t('v_contact'));
  if(!has(s.replyBy)) miss.push(t('f_replyBy'));
  if(s===S && Object.values(s.att||{}).some(Boolean) && !FILES.length) unk.push(t('att_nofile'));
  s.items.forEach((it,i)=>{
    const p=t('item')+' '+(i+1)+' – ';
    hard(it.name,p+t('i_name'));
    if(!has(it.model)&&!it.rows.some(r=>has(r.spec))) miss.push(p+t('i_ms'));
    it.rows.forEach((r,j)=>{
      const pr=p+(it.rows.length>1?t('row')+' '+(j+1)+' – ':'');
      hard(r.qty,pr+t('i_qty'));
      if(known(r.qty) && !(qtyNum(r.qty)>0)) miss.push(pr+t('v_qty'));
    });
    chk(it.code,p+t('i_code'));
    if(!has(it.cat)) miss.push(p+t('c_cat')); else if(it.cat==='unk') unk.push(p+t('c_cat'));
  });
  if(!has(SET.sender)) miss.push(t('s_sender'));
  if(!has(SET.company)) miss.push(t('s_company'));
  return {miss,unk};
}
const fmtQty = q => { const n=Number(String(q).replace(/,/g,'')); return has(q)&&isFinite(n) ? n.toLocaleString('ko-KR') : String(q||''); };

function buildInternal(s, v){

    `용도: ${KO_PURPOSE[s.purpose]||'(빈칸)'} / 삼성 요청 납기: ${d(s.needBy)}${has(s.repeat)?' / 연간 수요: '+s.repeat:''}`,

  r.push('카탈로그: '+s.items.map((it,i)=>`${i+1}) ${CN[it.cat]||'(빈칸)'}`).join(', '));

  return r.join('\n');
}

async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const a=el('textarea'); a.value=text; document.body.append(a); a.select(); let ok=false;
    try{ ok=document.execCommand('copy'); }catch(_){} a.remove(); return ok; }
}

function toRows(rec){
  const contact=[rec.supEmail,rec.supTel].filter(has).join(' / ');
  const CN={yes:'있음',no:'없음',unk:'미확인'};
  return rec.items.map((it,i)=>[rec.id,i+1,rec.ts,rec.staff||'',rec.supName||'',contact,rec.site||'',rec.dept||'',
    it.name||'',it.model||'',itemSpecText(it),String(itemTotal(it)),it.unit||'',it.code||'',it.moq||'',CN[it.cat]||'',KO_PURPOSE[rec.purpose]||'',rec.needBy||'',rec.replyBy||'']);
}
// 반환: null = 공유 저장 미설정, true/false = 성공/실패
async function syncRecord(rec){
  if(!syncOn()) return null;
  try{
    const r=await fetch(SET.syncUrl.trim(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:SET.syncToken,rows:toRows(rec)})});
    const j=await r.json(); return !!j.ok;
  }catch(e){ return false; }
}
async function syncGet(action){
  const r=await fetch(SET.syncUrl.trim()+'?action='+action+'&token='+encodeURIComponent(SET.syncToken));
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'fail'); return j;
}
async function loadShared(){
  const box=$('#shared'); box.textContent='';
  if(!syncOn()){ box.append(el('p',{class:'note'},t('sync_none'))); return; }
  box.append(el('p',{class:'note'},t('sync_loading')));
  try{
    const j=await syncGet('list'); box.textContent='';
    const cols=['작성일시','작성자','공급사','품명','수량','삼성 코드','회신 확인일','상태'].map(n=>j.head.indexOf(n));
    if(!j.rows.length){ box.append(el('p',{class:'note'},t('hist_empty'))); return; }
    box.append(el('table',null,
      el('thead',null,el('tr',null,cols.map(i=>el('th',null,j.head[i])))),
      el('tbody',null,j.rows.map(r=>el('tr',null,cols.map(i=>el('td',null,String(r[i]??''))))))));
  }catch(e){ box.textContent=''; box.append(el('p',{class:'box bad'},t('sync_fail'))); }
}
function renderHist(){
  const w=$('#hist'), h=getHist(); w.textContent='';
  if(!h.length){ w.append(el('p',{class:'note'},t('hist_empty'))); return; }
  const tb=el('table',null,el('thead',null,el('tr',null,
    ['h_date','h_staff','h_sup','h_items','h_where','h_unk'].map(k=>el('th',null,t(k))),el('th',null,''))));
  const body=el('tbody');
  h.forEach(r=>{
    const v=validate(r);
    body.append(el('tr',null,
      el('td',null,dateOf(r.ts)), el('td',null,r.staff||''), el('td',null,r.supName||''),
      el('td',null,r.items.map(it=>`${[it.name,it.model].filter(has).join(' ')} × ${fmtQty(itemTotal(it))}`).join(', ')),
      el('td',null,[r.site,r.dept].filter(has).join(' / ')),
      el('td',null,v.unk.join(', ')),
      el('td',{style:'white-space:nowrap'},
        el('button',{onclick:()=>{ const c=normalize(JSON.parse(JSON.stringify(r))); ['id','ts','mail','subject'].forEach(k=>delete c[k]); c.replyBy=addBizDays(3);
          S=c; FILES=[]; renderForm(); refresh(); showTab('write'); }},t('b_load')),' ',
        el('button',{class:'x',onclick:()=>{ if(confirm(t('del_q'))){ store.set('vst_rfq_hist',getHist().filter(x=>x.id!==r.id)); renderHist(); } }},t('b_del')))));
  });
  tb.append(body); w.append(tb);
}
function exportCsv(){
  // 엑셀 수식 주입 방지: = + - @ 로 시작하는 셀 앞에 ' 를 붙인다.
  const q=x=>{ let v=String(x??''); if(/^[=+\-@\t\r]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };
  const rows=[['날짜','담당 직원','삼성 법인·공장','사용 부서','삼성 담당자','용도','삼성 요청 납기','연간 수요','공급사','공급사 담당자','공급사 이메일','공급사 전화','품명','모델·품번','규격·사양','수량','단위','삼성 코드','MOQ','카탈로그','카탈로그 링크','회신 확인일','메모']];
  getHist().forEach(r=>r.items.forEach(it=>rows.push([dateOf(r.ts),r.staff,r.site,r.dept,r.sPic,KO_PURPOSE[r.purpose]||'',r.needBy,r.repeat,r.supName,r.supPic,r.supEmail,r.supTel,it.name,it.model,itemSpecText(it),itemTotal(it),it.unit,it.code,it.moq,({yes:'있음',no:'없음',unk:'미확인'})[it.cat]||'',it.catLink,r.replyBy,r.memo])));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=el('a',{href:URL.createObjectURL(blob),download:'VST_견적요청_기록_'+ymd(new Date())+'.csv'});
  document.body.append(a); a.click(); a.remove();
}

function showTab(name){
  ['write','hist','set'].forEach(n=>{ $('#tab-'+n).hidden = n!==name; });
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  if(name==='hist') renderHist();
  if(name==='write' && typeof renderForm==='function' && $('#form').children.length) renderForm();
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  document.title=t('title');
  renderForm(); renderSet(); refresh(); renderHist();
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; store.set('vst_rfq_lang',lang); applyLang(); });
$('#bCopy').onclick=async()=>{ if(!guard()||!attOK()) return; doneCopy(await copy($('#mailBody').value)); };
$('#bCopyInt').onclick=async()=>{ doneCopy(await copy($('#intBody').value)); };
$('#bCopyCall').onclick=async()=>{ if(!guard()) return; doneCopy(await copy($('#callBody').value)); };
$('#bCopyNudge').onclick=async()=>{ if(!guard()) return; doneCopy(await copy($('#nudgeBody').value)); };
$('#bGmail').onclick=async()=>{
  if(!guard()||!attOK()) return;
  // 팝업 차단을 피하려고 클릭 직후 동기적으로 먼저 연다.
  window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.supEmail||'')?S.supEmail:'')+'&su='+encodeURIComponent($('#mailSubj').value),'_blank','noopener');
  const ok=await copy($('#mailBody').value); const rec=saveRecord();
  toast(ok?t('toast_gmail'):t('toast_fail'));
  const s=await syncRecord(rec); if(s!==null) toast((ok?t('toast_gmail'):t('toast_fail'))+' · '+(s?t('sync_ok'):t('sync_fail')));
};
$('#bSave').onclick=async()=>{ if(!guard()) return; const rec=saveRecord(); toast(t('toast_saved'));
  const s=await syncRecord(rec); if(s!==null) toast(t('toast_saved')+' · '+(s?t('sync_ok'):t('sync_fail'))); };
$('#bShared').onclick=loadShared;
$('#bSyncTest').onclick=async()=>{ if(!syncOn()) return toast(t('sync_none')); try{ await syncGet('ping'); toast(t('sync_test_ok')); }catch(e){ toast(t('sync_fail')); } };
$('#bNew').onclick=()=>{ if(confirm(t('new_q'))){ const keep=S.staff; S=blank(); FILES=[]; S.staff=keep; renderForm(); refresh(); } };
$('#bCsv').onclick=exportCsv;
showTab('write'); applyLang();
</script>
